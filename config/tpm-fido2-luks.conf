# TPM-FIDO2-LUKS Configuration
# Edit these values for your system before running enroll.sh

# LUKS encrypted device (find with: lsblk -f, pvs, or blkid in dom0)
# Common Qubes layouts:
#   /dev/sda3          (direct partition)
#   /dev/nvme0n1p3     (NVMe)
LUKS_DEVICE="/dev/disk/by-uuid/REPLACE-WITH-YOUR-LUKS-UUID"

# LUKS mapped name (usually "luks-<uuid>": check /etc/crypttab in dom0)
LUKS_NAME="luks-REPLACE-WITH-YOUR-LUKS-UUID"

# TPM2 PCR banks to bind the sealed salt to
# PCR 0=firmware, 4=bootloader, 7=secure boot, 9=kernel+initramfs
# NOTE: PCR 9 only works if GRUB measures kernel/initramfs into the TPM.
# Check with: tpm2_pcrread sha256:9: if all zeros, GRUB isn't measuring.
# See README for how to enable GRUB TPM measurements.
PCR_BANKS="sha256:0,4,7"

# TPM2 persistent handle for the primary key
TPM_HANDLE="0x81000001"

# FIDO2 relying party ID (arbitrary string, identifies this use case on the token)
RELYING_PARTY="qubes-luks-unlock"

# FIDO2 token USB vendor:product ID (for reliable detection in initramfs)
# Used as a fallback if fido2-token -I doesn't report "fido2" capability.
# Common values:
#   Trezor Safe 5 / Model T:  1209:53c1
#   YubiKey 5:                 1050:0407
#   SoloKeys Solo 2:           1209:beee
#   Nitrokey FIDO2:            20a0:42b1
#   Google Titan:              18d1:5026
FIDO2_USB_VID="1209"
FIDO2_USB_PID="53c1"

# Timeout in seconds to wait for FIDO2 token at boot
FIDO2_TIMEOUT=30

# Configuration directory (installed to initramfs)
CONF_DIR="/etc/tpm-fido2-luks"
